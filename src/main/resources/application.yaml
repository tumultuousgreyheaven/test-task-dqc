spring:
  application:
    name: dqc

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dqc}
    username: ${DB_USER:dqc}
    password: ${DB_PASSWORD:dqc_password}

  jackson:
    # JSON в snake_case, как в summary-response-format.json
    property-naming-strategy: SNAKE_CASE

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
